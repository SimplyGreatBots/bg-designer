<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Chess game built with boardgame.io" />
    <title>Chess Game - boardgame.io</title>
    <style>
      /* Loading spinner while React loads */
      .loading-spinner {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f8f9fa;
      }
      
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #007bff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-right: 15px;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to play this chess game.</noscript>
    <div id="root">
      <!-- Loading indicator while React app loads -->
      <div class="loading-spinner">
        <div class="spinner"></div>
        <div>Loading Chess Game...</div>
      </div>
    </div>
    <script type="module" src="../src/index.js"></script>
  </body>
</html>
