<!DOCTYPE html><html lang="en"><head><link rel="stylesheet" href="/game.9f367d21.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess - boardgame.io Implementation</title>
    <meta name="description" content="Complete Chess implementation using boardgame.io framework, following FIDE Laws of Chess">
    <style>* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;
  overflow-x: hidden;
}

.loading {
  color: #fff;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-size: 1.5em;
  display: flex;
}

.loading:after {
  content: "";
  border: 4px solid #ffffff4d;
  border-top-color: #fff;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  margin-left: 15px;
  animation: 1s linear infinite spin;
}

@keyframes spin {
  0% {
    transform: rotate(0);
  }

  100% {
    transform: rotate(360deg);
  }
}

#root:not(:empty) + .loading {
  display: none;
}
</style>
</head>
<body>
    <!-- React app root -->
    <div id="root"></div>
    
    <!-- Loading fallback -->
    <div class="loading">
        Loading Chess Game
    </div>
    
    <!-- Entry point script -->
    <script type="module" src="/game.31b563d9.js"></script>


</body></html>
